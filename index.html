<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>ระบบสร้าง Label เลขเรียกหนังสือ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e9edee;
      --surface: #ffffff;
      --ink: #1e2a2f;
      --muted: #465960;
      --line: #e3e8e8;
      --line-strong: #aebbbc;
      --track: #eff2f2;
      --field: #f7f9f9;

      --accent: #2a6f7e;
      --accent-strong: #1a4b57;
      --accent-soft: rgba(35, 94, 108, .11);
      --on-accent: #ffffff;
      --ring: rgba(35, 94, 108, .30);

      --stage: #f1f4f4;
      --dash: #c5d1ce;
      --paper: #ffffff;
      --paper-ink: #18232a;
      --paper-line: #d9e2df;

      --shadow-card: 0 1px 2px rgba(20, 40, 45, .04), 0 10px 28px -16px rgba(20, 40, 45, .14);
      --shadow-paper: 0 1px 1px rgba(20, 40, 45, .06), 0 8px 20px -10px rgba(20, 40, 45, .25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', 'Angsana New', 'Noto Sans Thai', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ---------- Header ---------- */
    .app-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 4px;
    }

    .app-mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      display: grid;
      place-items: center;
      flex: none;
    }

    .app-header h1 {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
    }

    .app-mark svg.ico { width: 17px; height: 17px; }

    svg.ico {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---------- Cards ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: var(--shadow-card);
    }

    .field-label {
      display: block;
      font-size: 12.5px;
      font-weight: 400;
      color: #5f6f76;
      margin-bottom: 6px;
    }

    /* ---------- Font scale (เล็ก เงียบ ใช้นานๆ ครั้ง) ---------- */
    .scale-panel {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12.5px;
      color: var(--muted);
    }

    .scale-title { margin-right: auto; }

    .scale-reset {
      font: inherit;
      font-size: 12.5px;
      color: var(--accent-strong);
      background: none;
      border: 0;
      padding: 2px 6px;
      margin-right: 4px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .scale-reset.is-hidden { visibility: hidden; }

    .step-btn {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    }

    .step-btn svg.ico { width: 13px; height: 13px; stroke-width: 2.2; }

    .step-btn:hover:not(:disabled) {
      color: var(--accent-strong);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .step-btn:disabled { opacity: .35; cursor: default; }

    .step-btn:focus-visible,
    .scale-reset:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .scale-value {
      min-width: 3.6ch;
      text-align: center;
      font-weight: 500;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Segmented Control ---------- */
    .segmented {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .seg-btn {
      font: inherit;
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.3;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      min-height: 38px;
      padding: 6px 4px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      text-align: center;
      cursor: pointer;
      transition: background-color .15s ease, color .15s ease, border-color .15s ease;
    }

    .seg-btn svg.ico { width: 17px; height: 17px; flex: none; }

    .seg-btn:hover:not(.active-mode) {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .seg-btn.active-mode {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(20, 40, 45, .2);
    }

    .seg-btn:focus-visible,
    .btn-generate:focus-visible,
    .btn-print:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (max-width: 519px) {
      .segmented { grid-template-columns: repeat(2, 1fr); }
      .seg-btn { min-height: 42px; }
    }

    .mode-hint {
      margin-top: 6px;
      min-height: 19px;
      font-size: 12px;
      color: #66757b;
      padding-left: 2px;
    }

    /* ---------- Input Field ---------- */
    .entry {
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    #callNumberInput {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0 14px;
      font: inherit;
      font-size: 16px;
      color: var(--ink);
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
    }

    #callNumberInput::placeholder { color: #5f6f76; opacity: 1; font-size: 15px; }

    #callNumberInput:focus {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 4px var(--ring);
    }

    .btn-generate {
      height: 44px;
      padding: 0 22px;
      font: inherit;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--on-accent);
      background: var(--accent);
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      transition: background-color .15s ease, transform .05s ease;
    }

    .btn-generate:hover { background: var(--accent-strong); }
    .btn-generate:active { transform: translateY(1px); }

    .key-hint {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
      padding-left: 2px;
    }

    kbd {
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 0 5px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 6px;
      background: var(--field);
      color: var(--ink);
    }

    /* ---------- Result Stage ---------- */
    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .result-head h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .btn-actions {
      display: flex;
      gap: 6px;
    }

    .btn-print {
      min-width: 108px;
      justify-content: center;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 36px;
      padding: 0 16px;
      font: inherit;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--on-accent);
      background: var(--accent);
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      transition: background-color .15s ease, transform .05s ease;
    }

    .btn-print svg.ico { width: 17px; height: 17px; }

    .btn-print:hover:not(:disabled) { background: var(--accent-strong); }
    .btn-print:active:not(:disabled) { transform: translateY(1px); }

    .btn-print:disabled {
      color: #7d8b90;
      background: var(--track);
      cursor: default;
    }

    .head-note {
      font-size: 12.5px;
      font-weight: 400;
      color: var(--muted);
      margin-left: 6px;
    }

    .stage {
      background: var(--stage);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* กรอบ label 30x40 มม. ขยาย --k เท่า เพื่อให้เห็นชัดบนจอ (สัดส่วนจริง) */
    .label-frame {
      --k: 1.6;
      flex: none;
      width: calc(30mm * var(--k));
      height: calc(40mm * var(--k));
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      border: 1px solid var(--paper-line);
      border-radius: 4px;
      box-shadow: var(--shadow-paper);
    }

    .label-frame.is-empty {
      background: transparent;
      border: 1.5px dashed var(--dash);
      box-shadow: none;
    }

    .label-frame.is-over {
      outline: 2px solid #e2a04a;
      outline-offset: 2px;
    }

    /* ---------- หน้าจอพรีวิว (ใช้ค่าเดียวกับตอนพิมพ์ ยกเว้นคูณ --k) ---------- */
    .label-preview {
      --font-scale: 1;
      display: inline-block;
      width: fit-content;
      max-width: 100%;
      text-align: left;
      white-space: pre-line;
      word-break: break-word;
      font-family: 'Angsana New', 'AngsanaUPC', 'Sarabun', sans-serif;
      font-size: calc(24pt * var(--font-scale, 1) * var(--k, 1));
      font-style: normal;
      font-weight: 700;
      letter-spacing: .01em;
      color: var(--paper-ink);
      user-select: all;
    }

    #labelPreview[data-lines="1"],
    #labelPreview[data-lines="2"],
    #labelPreview[data-lines="3"] { line-height: 1.2; }
    #labelPreview[data-lines="4"] { line-height: 0.9; }
    #labelPreview[data-lines="5"] { line-height: 0.77; }
    #labelPreview[data-lines="6"] { line-height: 0.67; }
    #labelPreview[data-lines="7"] { line-height: 0.64; }

    .label-preview.is-empty {
      width: auto;
      padding: 0 14px;
      font-family: 'Sarabun', sans-serif;
      font-size: 13.5px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.5;
      text-align: center;
      color: var(--muted);
      user-select: none;
    }

    .raw-input-display {
      display: none;
      margin-top: 8px;
      text-align: left;
      font-size: 13px;
      line-height: 1.4;
      color: var(--muted);
      word-break: break-word;
    }

    .raw-input-display.show { display: block; }
    .raw-input-display span { font-weight: 400; margin-left: 2px; }

    /* ---------- คำเตือน ---------- */
    .fit-warn[hidden], .font-note[hidden] { display: none; }

    .fit-warn {
      margin-top: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      line-height: 1.4;
      color: #7a4300;
      background: #fff6e8;
      border: 1px solid #f0d6a8;
      border-radius: 10px;
    }

    .fit-warn svg.ico { width: 16px; height: 16px; flex: none; }

    .fit-btn {
      margin-left: auto;
      flex: none;
      font: inherit;
      font-weight: 600;
      color: inherit;
      background: none;
      border: 0;
      padding: 2px 4px;
      border-radius: 6px;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }

    .fit-btn:focus-visible { outline: 2px solid #7a4300; outline-offset: 2px; }

    .font-note {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.4;
      color: #7a4300;
    }

    /* ========================================================= */
    /*   การตั้งค่าพิมพ์: 3x4 ซม. Angsana New จัดกึ่งกลางสมบูรณ์   */
    /* ========================================================= */
    @media print {
      @page {
        size: 30mm 40mm;
        margin: 0 !important;
      }

      html, body {
        width: 30mm !important;
        height: 40mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        overflow: hidden !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
      }

      .app-header,
      .card:first-of-type,
      .result-head,
      .scale-panel,
      .fit-warn,
      .font-note,
      .raw-input-display {
        display: none !important;
      }

      .app, .card, .stage, .label-frame {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        background: transparent !important;
        box-shadow: none !important;
      }

      .label-frame {
        aspect-ratio: auto !important;
        overflow: visible !important;
        outline: none !important;
        border-radius: 0 !important;
      }

      #labelPreview.is-empty { display: none !important; }

      #labelPreview {
        display: inline-block !important;
        width: fit-content !important;
        text-align: left !important;

        font-family: 'Angsana New', 'AngsanaUPC', 'Sarabun', sans-serif !important;
        font-size: calc(24pt * var(--font-scale, 1)) !important; /* ย่อขนาดตัวอักษรลงขณะสั่งพิมพ์ */
        font-style: normal !important;
        font-weight: bold !important;
        color: #000000 !important;
        white-space: pre-line !important;

        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        padding: 0 !important;
        margin: 0 auto !important;

        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      /* ระยะห่างบรรทัดขณะสั่งพิมพ์ คงค่าเดิมไว้ตรงกับไฟล์ PDF ที่สวยงาม */
      #labelPreview[data-lines="1"] { line-height: 1.2 !important; }
      #labelPreview[data-lines="2"] { line-height: 1.2 !important; }
      #labelPreview[data-lines="3"] { line-height: 1.2 !important; }
      #labelPreview[data-lines="4"] { line-height: 0.9 !important; }
      #labelPreview[data-lines="5"] { line-height: 0.77 !important; }
      #labelPreview[data-lines="6"] { line-height: 0.67 !important; }
      #labelPreview[data-lines="7"] { line-height: 0.64 !important; }
    }
  </style>
</head>
<body>
  <main class="app">

    <header class="app-header">
      <div class="app-mark" aria-hidden="true">
        <svg class="ico" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2.5"/><path d="M9.5 8h5M9.5 12h5M9.5 16h3"/></svg>
      </div>
      <h1>ระบบสร้าง Label เลขเรียกหนังสือ</h1>
    </header>

    <section class="card" aria-label="ป้อนข้อมูล">
      <span class="field-label" id="modeLabel">ประเภทหนังสือ</span>
      <div class="segmented" role="radiogroup" aria-labelledby="modeLabel">
        <button type="button" class="seg-btn active-mode" data-mode="normal" role="radio" aria-checked="true"  onclick="setMode('normal')"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.5 5.3 8.3 4.7 5 4.7v12.6c3.3 0 5.5.6 7 1.8 1.5-1.2 3.7-1.8 7-1.8V4.7c-3.3 0-5.5.6-7 1.8zM12 6.5v12.6"/></svg><span>ทั่วไป / CRE</span></button>
        <button type="button" class="seg-btn" data-mode="rare"   role="radio" aria-checked="false" tabindex="-1" onclick="setMode('rare')"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12l4 6-10 13L2 9z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/></svg><span>หายาก</span></button>
        <button type="button" class="seg-btn" data-mode="ref"    role="radio" aria-checked="false" tabindex="-1" onclick="setMode('ref')"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>อ้างอิง</span></button>
        <button type="button" class="seg-btn" data-mode="thesis" role="radio" aria-checked="false" tabindex="-1" onclick="setMode('thesis')"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg><span>วพ</span></button>
      </div>
      <p class="mode-hint" id="modeHint">รวมถึงนิยาย / การ์ตูน / DOC</p>

      <div class="entry">
        <label class="field-label" for="callNumberInput">เลขเรียกหนังสือ</label>
        <div class="input-row">
          <input
            type="text"
            id="callNumberInput"
            placeholder="กรอกเลขเรียกหนังสือที่นี่"
            autocomplete="off"
            onkeydown="handleKeyDown(event)"
            autofocus
          >
          <button type="button" class="btn-generate" onclick="generateLabel()">สร้าง</button>
        </div>
        <p class="key-hint">กด <kbd>Enter</kbd> เพื่อสร้าง</p>
      </div>
    </section>

    <section class="card" aria-label="ผลลัพธ์">
      <div class="result-head">
        <h2>ผลลัพธ์<span class="head-note">label 3 × 4 ซม.</span></h2>
        <div class="btn-actions">
          <button type="button" class="btn-print" id="printBtn" onclick="window.print()" disabled>
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
              <rect x="6" y="14" width="12" height="8"/>
            </svg>
            <span>สั่งพิมพ์</span>
          </button>
        </div>
      </div>

      <div class="stage">
        <div class="label-frame is-empty" id="labelFrame">
          <div id="labelPreview" class="label-preview is-empty">ผลลัพธ์จะแสดงที่นี่</div>
        </div>
      </div>

      <div id="rawInputDisplay" class="raw-input-display"></div>

      <div class="fit-warn" id="fitWarn" role="status" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4.5M12 17.4v.1"/></svg>
        <span id="fitWarnText">ข้อความเกินขอบ label</span>
        <button type="button" class="fit-btn" id="fitBtn" onclick="fitFontScale()">ลดให้พอดี</button>
      </div>

      <div class="scale-panel" role="group" aria-label="ขนาดตัวอักษร">
        <span class="scale-title">ขนาดตัวอักษร</span>
        <button type="button" class="scale-reset is-hidden" id="scaleReset" onclick="updateFontScale(100)">คืนค่าปกติ</button>
        <button type="button" class="step-btn" id="scaleMinus" aria-label="ลดขนาดตัวอักษร 5%" onclick="nudgeFontScale(-5)">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
        <span class="scale-value" id="scaleValue" aria-live="polite">100%</span>
        <button type="button" class="step-btn" id="scalePlus" aria-label="เพิ่มขนาดตัวอักษร 5%" onclick="nudgeFontScale(5)">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <p class="font-note" id="fontNote" hidden>เครื่องนี้ไม่มีฟอนต์ Angsana New จึงใช้ Sarabun แทน ระยะบรรทัดและความกว้างอาจต่างจากที่ออกแบบไว้</p>
    </section>

  </main>

  <script>
    let currentMode = 'normal';
    let lastRawInput = '';

    const SCALE_MIN = 50, SCALE_MAX = 100;
    const SCALE_KEY = 'labelFontScalePct';
    let currentScale = 100;

    function updateFontScale(percentVal, persist = true) {
      let pct = Math.round(parseFloat(percentVal));
      if (!isFinite(pct)) pct = 100;
      pct = Math.min(SCALE_MAX, Math.max(SCALE_MIN, pct));
      currentScale = pct;

      const previewEl = document.getElementById('labelPreview');
      if (previewEl) previewEl.style.setProperty('--font-scale', pct / 100);

      document.getElementById('scaleValue').textContent = pct + '%';
      document.getElementById('scaleReset').classList.toggle('is-hidden', pct === 100);
      document.getElementById('scaleMinus').disabled = pct <= SCALE_MIN;
      document.getElementById('scalePlus').disabled = pct >= SCALE_MAX;

      if (persist) {
        try { localStorage.setItem(SCALE_KEY, String(pct)); } catch (e) {}
      }

      checkFit();
    }

    /* ---------- ตรวจว่าข้อความล้นกรอบ label หรือไม่ ---------- */
    function labelFits() {
      const frame = document.getElementById('labelFrame');
      const el = document.getElementById('labelPreview');
      const st = el.style;

      // วัดขนาดตามธรรมชาติ (ไม่ตัดบรรทัด)
      st.whiteSpace = 'pre';
      st.wordBreak = 'normal';
      st.width = 'max-content';
      st.maxWidth = 'none';
      const r = el.getBoundingClientRect();
      st.whiteSpace = st.wordBreak = st.width = st.maxWidth = '';

      const inset = frame.clientWidth / 60; // เผื่อขอบ 0.5 มม.
      return r.width  <= frame.clientWidth  - inset * 2 + 0.5 &&
             r.height <= frame.clientHeight - inset * 2 + 0.5;
    }

    function checkFit() {
      const frame = document.getElementById('labelFrame');
      const el = document.getElementById('labelPreview');
      const warn = document.getElementById('fitWarn');
      if (!frame || !el || !warn) return;

      if (el.classList.contains('is-empty')) {
        frame.classList.remove('is-over');
        warn.hidden = true;
        return;
      }

      const fits = labelFits();
      frame.classList.toggle('is-over', !fits);
      warn.hidden = fits;
      if (!fits) {
        const atMin = currentScale <= SCALE_MIN;
        document.getElementById('fitWarnText').textContent =
          atMin ? 'ข้อความยังเกินขอบ label แม้ใช้ขนาดเล็กสุด' : 'ข้อความเกินขอบ label';
        document.getElementById('fitBtn').hidden = atMin;
      }
    }

    function fitFontScale() {
      let p = currentScale;
      while (p > SCALE_MIN) {
        p = Math.max(SCALE_MIN, p - 5);
        updateFontScale(p, false);
        if (labelFits()) break;
      }
      updateFontScale(currentScale); // บันทึกค่าสุดท้าย
    }

    /* ---------- ตรวจว่ามีฟอนต์ Angsana New ในเครื่องหรือไม่ ---------- */
    function hasLocalFont(name) {
      const ctx = document.createElement('canvas').getContext('2d');
      const sample = 'ทดสอบ Ra QA76.73 1234';
      return ['monospace', 'serif', 'sans-serif'].some(base => {
        ctx.font = '72px ' + base;
        const baseW = ctx.measureText(sample).width;
        ctx.font = '72px "' + name + '", ' + base;
        return ctx.measureText(sample).width !== baseW;
      });
    }

    function detectPrintFont() {
      const ok = hasLocalFont('Angsana New') || hasLocalFont('AngsanaUPC');
      document.getElementById('fontNote').hidden = ok;
    }

    /* ---------- เลือกประเภทหนังสือด้วยคีย์บอร์ด (ลูกศร / Home / End) ---------- */
    function initSegmented() {
      const group = document.querySelector('.segmented');
      const input = document.getElementById('callNumberInput');
      const fine = window.matchMedia('(pointer: fine)');

      group.addEventListener('keydown', e => {
        const btns = Array.from(group.querySelectorAll('.seg-btn'));
        const i = btns.indexOf(document.activeElement);
        if (i < 0) return;

        let next;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (i + 1) % btns.length;
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (i - 1 + btns.length) % btns.length;
        else if (e.key === 'Home') next = 0;
        else if (e.key === 'End') next = btns.length - 1;
        else return;

        e.preventDefault();
        btns[next].focus();
        setMode(btns[next].dataset.mode);
      });

      // คลิกด้วยเมาส์แล้วกลับไปที่ช่องกรอก (ไม่ทำบนจอสัมผัส เพื่อไม่ให้คีย์บอร์ดเด้ง)
      group.addEventListener('click', e => {
        if (e.detail > 0 && fine.matches) input.focus();
      });
    }

    function nudgeFontScale(delta) {
      updateFontScale(currentScale + delta);
    }

    function initFontScale() {
      let saved = 100;
      try {
        const v = localStorage.getItem(SCALE_KEY);
        if (v !== null) saved = parseFloat(v);
      } catch (e) {}
      updateFontScale(saved, false);
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    const MODE_HINTS = {
      normal: 'รวมถึงนิยาย / การ์ตูน / DOC',
      rare:   'เติม ก หรือ Ra',
      ref:    'เติม อ หรือ R',
      thesis: 'เติม วพ หรือ T'
    };

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.seg-btn').forEach(btn => {
        const on = btn.dataset.mode === mode;
        btn.classList.toggle('active-mode', on);
        btn.setAttribute('aria-checked', on ? 'true' : 'false');
        btn.tabIndex = on ? 0 : -1;
      });
      document.getElementById('modeHint').textContent = MODE_HINTS[mode] || '';

      const input = document.getElementById('callNumberInput').value;
      if (input.trim() || lastRawInput) {
        generateLabel(true);
      }
    }

    function setPreview(text, isEmpty) {
      const el = document.getElementById('labelPreview');
      el.innerText = text;
      el.classList.toggle('is-empty', isEmpty);
      document.getElementById('labelFrame').classList.toggle('is-empty', isEmpty);
      document.getElementById('printBtn').disabled = isEmpty;

      if (!isEmpty) {
        el.setAttribute('data-lines', text.split('\n').length);
      } else {
        el.removeAttribute('data-lines');
      }

      checkFit();
    }

    function hasThai(str) {
      return /[\u0E00-\u0E7F]/i.test(str);
    }

    function getPrefixForMode(mode, inputStr) {
      if (mode === 'normal') return null;
      const isThai = hasThai(inputStr);
      if (mode === 'rare') return isThai ? 'ก' : 'Ra';
      if (mode === 'ref') return isThai ? 'อ' : 'R';
      if (mode === 'thesis') return isThai ? 'วพ' : 'T';
      return null;
    }

    function countLetters(str) {
      const matches = str.match(/[^\d\s\.]/g);
      return matches ? matches.length : 0;
    }

    function parseCutters(rawCutterStr) {
      if (!rawCutterStr) return [];
      let clean = rawCutterStr.replace(/\./g, ' ').trim();
      if (!clean) return [];

      const units = clean.match(/[^\d\s]+\d*/g) || clean.split(/\s+/);
      const cutterLines = [];
      let currentLine = '';
      let currentLetterCount = 0;

      for (let unit of units) {
        unit = unit.replace(/\./g, '');
        const unitLetters = countLetters(unit);

        if (!currentLine) {
          currentLine = unit;
          currentLetterCount = unitLetters;
        } else {
          if (currentLetterCount + unitLetters <= 2) {
            currentLine += unit;
            currentLetterCount += unitLetters;
          } else {
            cutterLines.push(currentLine);
            currentLine = unit;
            currentLetterCount = unitLetters;
          }
        }
      }
      if (currentLine) cutterLines.push(currentLine);

      return cutterLines;
    }

    function generateLabel(fromModeChange = false) {
      const inputEl = document.getElementById('callNumberInput');
      let rawInput = inputEl.value;

      if (!rawInput.trim() && fromModeChange && lastRawInput) {
        rawInput = lastRawInput;
      }

      const rawDisplayEl = document.getElementById('rawInputDisplay');

      let str = rawInput.trim();
      if (!str) {
        setPreview('กรุณากรอกข้อมูล', true);
        if (rawDisplayEl) {
          rawDisplayEl.innerHTML = '';
          rawDisplayEl.classList.remove('show');
        }
        return;
      }

      lastRawInput = str;

      if (rawDisplayEl) {
        rawDisplayEl.innerHTML = 'จาก Call No.: <span>' + escapeHtml(str) + '</span>';
        rawDisplayEl.classList.add('show');
      }

      inputEl.value = '';

      let lines = [];

      if (/CRE/i.test(str)) {
        let clean = str.replace(/^(Ra|ก|อ|R|วพ|T)\s+/i, '').replace(/^CRE\s+/i, '').trim();
        const tokens = clean.split(/\s+/).filter(t => t.length > 0);
        let year = '', accession = '', volParts = [];

        for (let t of tokens) {
          if (!year && /^[12]\d{3}(?:-(?:[12]\d{3}|\d{2}))?$/.test(t)) year = t;
          else if (!accession && /^\d+$/.test(t)) accession = t;
          else volParts.push(t);
        }

        lines = ['Ra', 'CRE'];
        if (year) lines.push(year);
        if (accession) lines.push(accession);
        if (volParts.length > 0) lines.push(volParts.join(' '));
      } else {
        const prefixLine = getPrefixForMode(currentMode, str);
        str = str.replace(/^(Ra|ก|อ|R|วพ|T)\s+/i, '');

        const ficMatch = str.match(/^(นว|Fic|กต|Comic)[\s\.]*/i);
        let ficPrefix = null;
        if (ficMatch) {
          ficPrefix = ficMatch[1];
          str = str.substring(ficMatch[0].length).trim();
        }

        let classPrefix = '', classNum = '';
        if (!ficPrefix) {
          const classMatch = str.match(/^([A-Za-z\u0E00-\u0E7F]+)\s*(\d+(?:\.\d+)?)/);
          if (classMatch) {
            classPrefix = classMatch[1];
            classNum = classMatch[2];
            str = str.substring(classMatch[0].length).trim();
          }
        }

        const monthRegexStr = `(?:ม\\.ค\\.?|ก\\.พ\\.?|มี\\.ค\\.?|เม\\.ย\\.?|พ\\.ค\\.?|มิ\\.ย\\.?|ก\\.ค\\.?|ส\\.ค\\.?|ก\\.ย\\.?|ต\\.ค\\.?|พ\\.ย\\.?|ธ\\.ค\\.?|มกราคม|กุมภาพันธ์|มีนาคม|เมษายน|พฤษภาคม|มิถุนายน|กรกฎาคม|สิงหาคม|กันยายน|ตุลาคม|พฤศจิกายน|ธันวาคม|Jan[a-zA-Z]*\\.?|Feb[a-zA-Z]*\\.?|Mar[a-zA-Z]*\\.?|Apr[a-zA-Z]*\\.?|May[a-zA-Z]*\\.?|Jun[a-zA-Z]*\\.?|Jul[a-zA-Z]*\\.?|Aug[a-zA-Z]*\\.?|Sep[a-zA-Z]*\\.?|Sept[a-zA-Z]*\\.?|Oct[a-zA-Z]*\\.?|Nov[a-zA-Z]*\\.?|Dec[a-zA-Z]*\\.?)`;
        const yearRegexStr = `(?:[12]\\d{3})`;

        const patternMonthYearRange = new RegExp(monthRegexStr + '\\s*' + yearRegexStr + '\\s*-\\s*' + monthRegexStr + '\\s*' + yearRegexStr, 'i');
        const patternMonthRangeYear = new RegExp(monthRegexStr + '\\s*-\\s*' + monthRegexStr + '\\s*' + yearRegexStr, 'i');
        const patternMonthYear = new RegExp(monthRegexStr + '\\s*' + yearRegexStr, 'i');
        const yearPattern = /\b[12]\d{3}(?:-(?:[12]\d{3}|\d{2}))?\b/;

        const yearMatch = str.match(patternMonthYearRange) ||
                          str.match(patternMonthRangeYear) ||
                          str.match(patternMonthYear) ||
                          str.match(yearPattern);

        let year = '', restBeforeYear = str, restAfterYear = '';
        if (yearMatch) {
          year = yearMatch[0];
          const idx = yearMatch.index;
          restBeforeYear = str.substring(0, idx).trim();
          restAfterYear = str.substring(idx + year.length).trim();
        }

        const monthPattern = /(?:[\u0E00-\u0E7F]+\.[\u0E00-\u0E7F]+\.-[\u0E00-\u0E7F]+\.[\u0E00-\u0E7F]+\.?|[A-Za-z]{3,4}\.?-[A-Za-z]{3,4}\.?)/i;
        let monthStr = '';
        const monthMatchAfter = restAfterYear.match(monthPattern);
        if (monthMatchAfter) {
          monthStr = monthMatchAfter[0];
          restAfterYear = (restAfterYear.substring(0, monthMatchAfter.index) + ' ' + restAfterYear.substring(monthMatchAfter.index + monthStr.length)).trim();
        } else {
          const monthMatchBefore = restBeforeYear.match(monthPattern);
          if (monthMatchBefore) {
            monthStr = monthMatchBefore[0];
            restBeforeYear = (restBeforeYear.substring(0, monthMatchBefore.index) + ' ' + restBeforeYear.substring(monthMatchBefore.index + monthStr.length)).trim();
          }
        }

        let volAndPartsStr = restAfterYear;
        let cutterStr = restBeforeYear;

        if (!year && !monthStr) {
          const volPartMatch = cutterStr.match(/(?:\s+|^)((?:ล\.|เล่ม|v\.|V\.|c\.|C\.|bd\.|pt\.|Pt\.|vol\.|Vol\.|ฉ\.|ต\.|ตอน|part|Part)\s*\d+.*)$/i);
          if (volPartMatch) {
            volAndPartsStr = volPartMatch[1].trim();
            cutterStr = cutterStr.substring(0, volPartMatch.index).trim();
          }
        }

        let volPartLines = [];
        if (volAndPartsStr) {
          const tokens = volAndPartsStr.match(/(?:ล\.|เล่ม|v\.|V\.|c\.|C\.|bd\.|vol\.|Vol\.|ฉ\.|ต\.|ตอน|pt\.|Pt\.|part|Part)\s*\d+[a-zA-Z\u0E00-\u0E7F]*/gi);
          if (tokens) {
            volPartLines = tokens.map(t => t.trim());
          } else {
            volPartLines = [volAndPartsStr];
          }
        }

        const cutterLines = parseCutters(cutterStr);

        if (prefixLine) lines.push(prefixLine);
        if (ficPrefix) {
          lines.push(ficPrefix);
        } else {
          if (classPrefix) lines.push(classPrefix);
          if (classNum) lines.push(classNum);
        }
        lines.push(...cutterLines);
        if (year) lines.push(year);
        if (monthStr) lines.push(monthStr);
        lines.push(...volPartLines);
      }

      if (lines.length > 7) {
        const top6 = lines.slice(0, 6);
        const rest = lines.slice(6).join(' ');
        lines = [...top6, rest];
      }

      setPreview(lines.join('\n'), false);
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        generateLabel();
      }
    }

    initFontScale();
    initSegmented();
    detectPrintFont();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => { detectPrintFont(); checkFit(); });
    }
  </script>
